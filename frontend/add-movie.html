<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Movie - Movie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to bottom right, #e0f2fe, #ddd6fe, #fce7f3);
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <h1 class="text-2xl font-bold text-purple-600">Movie Tracker</h1>
          </div>
          <div class="flex items-center space-x-4">
            <a
              href="dashboard.html"
              class="text-gray-700 hover:text-purple-600 transition"
              >Dashboard</a
            >
            <button
              id="logoutBtn"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div class="mb-8">
          <h2 class="text-3xl font-bold text-gray-800 mb-2">Add New Movie</h2>
          <p class="text-gray-600">
            Fill in the details below to add a movie to your collection
          </p>
        </div>

        <form id="addMovieForm" class="space-y-6">
          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Movie Title *</label
            >
            <input
              type="text"
              id="title"
              required
              maxlength="200"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="Enter movie title"
            />
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label
                for="year"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Year *</label
              >
              <input
                type="number"
                id="year"
                required
                min="1888"
                max="2099"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                placeholder="2024"
              />
            </div>

            <div>
              <label
                for="genre"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Genre *</label
              >
              <select
                id="genre"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              >
                <option value="">Select genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Romance">Romance</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label
                for="movieStatus"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Status</label
              >
              <select
                id="movieStatus"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              >
                <option value="pending">Pending</option>
                <option value="ongoing">Ongoing</option>
                <option value="completed">Completed</option>
              </select>
            </div>

            <div>
              <label
                for="rating"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Rating (1-10)</label
              >
              <input
                type="number"
                id="rating"
                min="1"
                max="10"
                step="0.1"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                placeholder="8.5"
              />
            </div>
          </div>

          <div class="flex space-x-4 pt-4">
            <button
              type="submit"
              class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition transform hover:scale-105"
            >
              Add Movie
            </button>
            <a
              href="dashboard.html"
              class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400 transition text-center"
            >
              Cancel
            </a>
          </div>
        </form>

        <div id="message" class="mt-6 p-4 rounded-lg hidden"></div>

        <!-- AI Analysis Section -->
        <div class="mt-8 pt-8 border-t border-gray-200">
          <h3 class="text-xl font-bold text-gray-800 mb-4">
            AI Movie Analysis
          </h3>
          <p class="text-gray-600 mb-4">
            Get AI-powered insights about any movie
          </p>

          <form id="analyzeForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <input
                type="text"
                id="analyzeTitle"
                class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                placeholder="Movie title"
              />
              <input
                type="number"
                id="analyzeYear"
                class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                placeholder="Year"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition"
            >
              Analyze Movie
            </button>
          </form>

          <div id="aiResult" class="mt-4 p-4 bg-blue-50 rounded-lg hidden">
            <h4 class="font-bold text-gray-800 mb-2">AI Analysis:</h4>
            <div id="aiContent" class="text-gray-700"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'http://localhost:3000';
      const token = localStorage.getItem('token');

      //   if (!token) {
      //     window.location.href = 'login.html';
      //   }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
      });

      // Add Movie
      document
        .getElementById('addMovieForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const movieData = {
            title: document.getElementById('title').value,
            year: parseInt(document.getElementById('year').value),
            genre: document.getElementById('genre').value,
            movieStatus: document.getElementById('movieStatus').value,
          };

          const rating = document.getElementById('rating').value;
          if (rating) {
            movieData.rating = parseFloat(rating);
          }

          const messageDiv = document.getElementById('message');

          try {
            const response = await fetch(`${API_URL}/movies`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(movieData),
            });

            const data = await response.json();

            if (response.ok) {
              messageDiv.className =
                'mt-6 p-4 rounded-lg bg-green-100 text-green-700';
              messageDiv.textContent =
                'Movie added successfully! Redirecting...';
              messageDiv.classList.remove('hidden');

              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 1500);
            } else {
              messageDiv.className =
                'mt-6 p-4 rounded-lg bg-red-100 text-red-700';
              messageDiv.textContent = data.message || 'Failed to add movie';
              messageDiv.classList.remove('hidden');
            }
          } catch (error) {
            messageDiv.className =
              'mt-6 p-4 rounded-lg bg-red-100 text-red-700';
            messageDiv.textContent = 'Error connecting to server';
            messageDiv.classList.remove('hidden');
          }
        });

      // AI Analysis
      document
        .getElementById('analyzeForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const title = document.getElementById('analyzeTitle').value;
          const year = document.getElementById('analyzeYear').value;

          if (!title || !year) {
            alert('Please provide both title and year');
            return;
          }

          const aiResult = document.getElementById('aiResult');
          const aiContent = document.getElementById('aiContent');

          aiContent.innerHTML = '<p class="text-gray-600">Analyzing...</p>';
          aiResult.classList.remove('hidden');

          try {
            const response = await fetch(`${API_URL}/ai/analyze`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ title, year: parseInt(year) }),
            });

            const data = await response.json();

            if (response.ok && data.datae && data.datae.length > 0) {
              const analysis = data.datae[0];
              aiContent.innerHTML = `
                        <p class="mb-2"><strong>Details:</strong> ${analysis.details}</p>
                        <p class="mb-2"><strong>Overall Rating:</strong> ${analysis.overallUserRating}</p>
                        <p><strong>Genre:</strong> ${analysis.genre}</p>
                    `;
            } else {
              aiContent.innerHTML =
                '<p class="text-red-600">Unable to analyze movie</p>';
            }
          } catch (error) {
            aiContent.innerHTML =
              '<p class="text-red-600">Error analyzing movie</p>';
          }
        });
    </script>
  </body>
</html>
