<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Movie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <h1 class="text-2xl font-bold text-purple-600">Movie Tracker</h1>
          </div>
          <div class="flex items-center space-x-4">
            <span id="userName" class="text-gray-700"></span>
            <a
              href="add-movie.html"
              class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"
              >Add Movie</a
            >
            <a
              href="ai-recommendations.html"
              class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition"
              >AI Recommendations</a
            >
            <button
              id="logoutBtn"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">
          My Movie Collection
        </h2>
        <p class="text-gray-600">Track and manage your favorite movies</p>
      </div>

      <!-- Filter Tabs -->
      <div class="mb-6 flex space-x-4">
        <button
          onclick="filterMovies('all')"
          class="filter-btn px-6 py-2 rounded-lg bg-purple-600 text-white font-semibold"
        >
          All
        </button>
        <button
          onclick="filterMovies('pending')"
          class="filter-btn px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300"
        >
          Pending
        </button>
        <button
          onclick="filterMovies('ongoing')"
          class="filter-btn px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300"
        >
          Ongoing
        </button>
        <button
          onclick="filterMovies('completed')"
          class="filter-btn px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300"
        >
          Completed
        </button>
      </div>

      <!-- Movies Grid -->
      <div
        id="moviesGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <!-- Movies will be loaded here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-12 hidden">
        <svg
          class="mx-auto h-24 w-24 text-gray-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"
          />
        </svg>
        <h3 class="mt-4 text-xl font-semibold text-gray-800">No movies yet</h3>
        <p class="mt-2 text-gray-600">Start by adding your first movie!</p>
        <a
          href="add-movie.html"
          class="mt-4 inline-block bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition"
          >Add Movie</a
        >
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <h3 class="text-2xl font-bold text-gray-800 mb-6">Edit Movie</h3>
        <form id="editForm" class="space-y-4">
          <input type="hidden" id="editMovieId" />
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Title</label
            >
            <input
              type="text"
              id="editTitle"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
            />
          </div>
          <div class="flex space-x-4">
            <button
              type="submit"
              class="flex-1 bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"
            >
              Save
            </button>
            <button
              type="button"
              onclick="closeEditModal()"
              class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_URL = 'http://localhost:3000';
      let allMovies = [];
      let currentFilter = 'all';

      // Check authentication
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');

      if (!token) {
        window.location.href = 'login.html';
      }

      document.getElementById('userName').textContent = `Hello, ${user.name}!`;

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
      });

      // Load movies
      async function loadMovies() {
        try {
          const response = await fetch(
            `${API_URL}/movies/get-all-user-movies`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            },
          );

          const data = await response.json();

          if (response.ok) {
            allMovies = data.payload || [];
            displayMovies();
          } else if (
            response.status === 400 &&
            data.message.includes('No movies')
          ) {
            allMovies = [];
            displayMovies();
          }
        } catch (error) {
          console.error('Error loading movies:', error);
        }
      }

      function displayMovies() {
        const grid = document.getElementById('moviesGrid');
        const emptyState = document.getElementById('emptyState');

        let filteredMovies =
          currentFilter === 'all'
            ? allMovies
            : allMovies.filter((m) => m.movieStatus === currentFilter);

        if (filteredMovies.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        grid.innerHTML = filteredMovies
          .map(
            (movie) => `
                <div class="bg-white rounded-xl shadow-lg overflow-hidden transform transition hover:scale-105">
                    <div class="bg-gradient-to-r from-purple-500 to-indigo-500 p-4">
                        <h3 class="text-xl font-bold text-white truncate">${
                          movie.title
                        }</h3>
                        <p class="text-purple-100">${movie.year}</p>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-4">
                            <span class="px-3 py-1 rounded-full text-sm font-semibold ${getStatusColor(
                              movie.movieStatus,
                            )}">${movie.movieStatus}</span>
                            <span class="px-3 py-1 bg-gray-100 rounded-full text-sm font-semibold text-gray-700">${
                              movie.genre
                            }</span>
                        </div>
                        ${
                          movie.rating
                            ? `
                            <div class="mb-4">
                                <span class="text-gray-600">Rating:</span>
                                <span class="font-bold text-purple-600">${movie.rating}/10</span>
                            </div>
                        `
                            : ''
                        }
                        <div class="flex space-x-2">
                            <button onclick="editMovie('${movie._id}', '${
              movie.title
            }')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Edit</button>
                            <button onclick="deleteMovie('${
                              movie._id
                            }')" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">Delete</button>
                        </div>
                    </div>
                </div>
            `,
          )
          .join('');
      }

      function getStatusColor(status) {
        const colors = {
          pending: 'bg-yellow-100 text-yellow-800',
          ongoing: 'bg-blue-100 text-blue-800',
          completed: 'bg-green-100 text-green-800',
        };
        return colors[status] || 'bg-gray-100 text-gray-800';
      }

      function filterMovies(filter) {
        currentFilter = filter;
        displayMovies();

        // Update button styles
        document.querySelectorAll('.filter-btn').forEach((btn) => {
          btn.className =
            'filter-btn px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300';
        });
        event.target.className =
          'filter-btn px-6 py-2 rounded-lg bg-purple-600 text-white font-semibold';
      }

      function editMovie(id, title) {
        document.getElementById('editMovieId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editModal').classList.remove('hidden');
      }

      function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
      }

      document
        .getElementById('editForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = document.getElementById('editMovieId').value;
          const title = document.getElementById('editTitle').value;

          try {
            const response = await fetch(`${API_URL}/movies/${id}`, {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ title }),
            });

            if (response.ok) {
              closeEditModal();
              loadMovies();
            }
          } catch (error) {
            console.error('Error updating movie:', error);
          }
        });

      async function deleteMovie(id) {
        if (!confirm('Are you sure you want to delete this movie?')) return;

        try {
          const response = await fetch(`${API_URL}/movies/${id}`, {
            method: 'DELETE',
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.ok) {
            loadMovies();
          }
        } catch (error) {
          console.error('Error deleting movie:', error);
        }
      }

      loadMovies();
    </script>
  </body>
</html>
