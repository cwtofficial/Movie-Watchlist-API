<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Movie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Create Account</h1>
        <p class="text-gray-600">Join Movie Tracker today</p>
      </div>

      <form id="registerForm" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2"
            >Name</label
          >
          <input
            type="text"
            id="name"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
            placeholder="John Doe"
          />
        </div>

        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Email</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
            placeholder="your@email.com"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            minlength="6"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition transform hover:scale-105"
        >
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600">
          Already have an account?
          <a
            href="login.html"
            class="text-purple-600 hover:text-purple-800 font-semibold"
            >Sign In</a
          >
        </p>
      </div>

      <div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
    </div>

    <script>
      const API_URL = 'http://localhost:3000';

      document
        .getElementById('registerForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const name = document.getElementById('name').value;
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          const messageDiv = document.getElementById('message');

          try {
            const response = await fetch(`${API_URL}/user/register`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              messageDiv.className =
                'mt-4 p-4 rounded-lg bg-green-100 text-green-700';
              messageDiv.textContent =
                'Registration successful! Redirecting to login...';
              messageDiv.classList.remove('hidden');

              setTimeout(() => {
                window.location.href = 'login.html';
              }, 1500);
            } else {
              messageDiv.className =
                'mt-4 p-4 rounded-lg bg-red-100 text-red-700';
              messageDiv.textContent = data.message || 'Registration failed';
              messageDiv.classList.remove('hidden');
            }
          } catch (error) {
            messageDiv.className =
              'mt-4 p-4 rounded-lg bg-red-100 text-red-700';
            messageDiv.textContent = 'Error connecting to server';
            messageDiv.classList.remove('hidden');
          }
        });
    </script>
  </body>
</html>
